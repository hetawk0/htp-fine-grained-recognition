# F1PUSH_v5_qd stage A — QuickDraw house/tree/face sketch pretrain (domain prior).
# Lab data: datasets/raw/quickdraw/numpy_bitmap/{house,tree,face}.npy
# After this run: resume backbone into DD soft FT (stage B = dd_f1_push_v3_soft + resume qd best).
base: default.yaml

seed: 42

data:
  name: quickdraw
  display_name: QuickDraw-HTP
  root: datasets/raw/quickdraw/numpy_bitmap
  categories: [house, tree, face]
  samples_per_class: 8000       # ~24k sketches; adjust if RAM/time tight
  image_size: 224               # QD is 28x28; 224 is enough for stroke pretrain
  invert: true                  # white-on-black → HTP-like black-on-white
  augment: true
  strong_aug: false
  contrast_stretch: false
  binary: false
  split_ratios: [0.8, 0.1, 0.1]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

model:
  name: soe_fbanet
  num_classes: 3
  backbone: cnn_lite
  pretrained: false
  use_sofe: true
  use_sosm: true
  use_wff: true
  use_bilevel_attention: true
  use_small_object_branch: true
  multi_scale_sofe: true
  so_weight: 1.5
  learnable_fusion: true
  semantic_dim: 64
  dropout: 0.2

train:
  epochs: 30
  batch_size: 64
  lr: 1.0e-3
  weight_decay: 1.0e-4
  so_penalty: 0.0               # QD so_mask is heuristic only
  label_smoothing: 0.05
  class_weights: null
  class_balanced_sampler: false
  monitor: f1                   # 3-class macro-F1 (argmax)
  patience: 8
  lr_schedule: cosine
  lr_min: 1.0e-5
  num_workers: 4
  device: auto
  out_dir: outputs/quickdraw_htp_pretrain
  log_every: 20
