# D25 LONG_EARLY_CLOSE — D21 LONG_DDNORM with close_aug that actually fires
# D21/D24 set close_train_aug_epochs=15 → soft_aug_epochs=105; ES@52/60 so
# eval-like phase NEVER ran. Ultralytics lesson: close must land inside patience.
#
# Single new lever on D21 recipe (no EMA — D24 null; no freeze/FT; no strong_aug):
#   - soft_aug_epochs=35 (mild crop/flip/rot 1–35, then Resize-only)
#   - patience=30 so post-close selection has room
#   - same DD mean/std, warmup=3, monitor=f1_tau, LONG CW
# Honest EV: small (+0–0.02); does not bridge to 0.90 alone.
base: ../dd_train.yaml

seed: 42

data:
  strong_aug: false
  include_augmented: false
  contrast_stretch: true
  mean: [0.9817, 0.9817, 0.9817]
  std: [0.0828, 0.0828, 0.0828]

model:
  dropout: 0.3

train:
  epochs: 100
  freeze_epochs: 0
  backbone_lr_mult: 1.0
  lr: 1.0e-4
  weight_decay: 1.0e-3
  lr_schedule: cosine
  lr_min: 1.0e-6
  warmup_epochs: 3.0
  monitor: f1_tau
  patience: 30
  threshold_criterion: f1
  class_weights: [0.6421, 2.2599]
  class_balanced_sampler: true
  sampler_de_boost: 1.0
  focal_gamma: 0.0
  dice_weight: 0.0
  label_smoothing: 0.0
  tta_hflip: true
  so_penalty: 2.0
  batch_size: 8
  amp: false
  grad_clip_norm: 0.0
  # PRIMARY: fire close inside ES window (D21's last-15-of-120 never ran)
  soft_aug_epochs: 35
  close_train_aug_epochs: 0
  ema_decay: 0.0
  out_dir: outputs/htp_depression_dd_exp_d25_long_early_close
  log_every: 5
