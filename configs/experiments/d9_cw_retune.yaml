# D9 CW_RETUNE — D1 core + ONE lever: mild De-heavier class weights (loss only)
# Evidence: D8 LS=0.10 null (test F1@τ 0.763); D7 stacked CW+de_boost+dice null;
#   D4b QD init ≪ D1 mid-run. Keep forever-freeze / micro-LR / LS=0.05 / no strong_aug.
# Isolates class_weights (not tried alone). No sampler_de_boost / dice / focal.
base: ../dd_train.yaml

seed: 42

data:
  strong_aug: false
  include_augmented: false

model:
  dropout: 0.3

train:
  resume: outputs/htp_depression_dd_exp_d1_head_micro/best.pt
  epochs: 50
  freeze_epochs: 999
  backbone_lr_mult: 0.0
  lr: 5.0e-6
  weight_decay: 1.0e-3
  lr_schedule: cosine
  lr_min: 1.0e-8
  monitor: f1_tau
  patience: 25
  threshold_criterion: f1
  class_weights: [0.55, 2.55]   # primary lever vs D1 / LONG [0.6421, 2.2599]
  class_balanced_sampler: true
  sampler_de_boost: 1.0         # keep D1; do not repeat D7 de_boost
  focal_gamma: 0.0
  dice_weight: 0.0
  label_smoothing: 0.05
  tta_hflip: true
  so_penalty: 2.0
  batch_size: 8
  out_dir: outputs/htp_depression_dd_exp_d9_cw_retune
  log_every: 5
