# D4a QD_PRETRAIN — sketch-domain house/tree/face (NOT clinical metrics)
# Data on lab: datasets/raw/quickdraw/numpy_bitmap/{house,tree,face}.npy
# After this: transfer backbone → D4b DD fine-tune (see design card).
base: ../default.yaml

seed: 42

data:
  name: quickdraw
  display_name: QuickDraw-HTP-bootstrap
  root: datasets/raw/quickdraw/numpy_bitmap
  image_size: 224
  invert: true
  augment: true
  binary: false              # 3-class house/tree/face
  samples_per_class: 4000
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

model:
  name: soe_fbanet
  num_classes: 3
  backbone: cnn_lite
  pretrained: false
  use_sofe: true
  use_sosm: true
  use_wff: true
  use_bilevel_attention: true
  use_small_object_branch: false
  multi_scale_sofe: true
  so_weight: 1.0
  learnable_fusion: true
  semantic_dim: 64
  dropout: 0.2

train:
  epochs: 15
  batch_size: 32
  lr: 1.0e-4
  weight_decay: 1.0e-3
  so_penalty: 0.0
  class_balanced_sampler: false
  monitor: f1
  patience: 5
  lr_schedule: cosine
  lr_min: 1.0e-6
  num_workers: 4
  device: auto
  out_dir: outputs/quickdraw_htp_pretrain
  log_every: 20
