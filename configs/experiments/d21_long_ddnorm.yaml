# D21 LONG_DDNORM — from-scratch LONG remake with measured DD mean/std
# Biggest unused Ultralytics/lab lever after D19/D20 freeze-FT nulls.
# Do NOT resume D1/LONG: ImageNet-normed features cannot retarget mean/std.
#
# Package (single coherent remake, not stacked freeze-FT knobs):
#   - data.mean/std ≈ 0.9817 / 0.0828 (contrast_stretch@512 train measure)
#   - warmup_epochs=3 (Ultralytics-style; floors ≥100 steps)
#   - no-WD Norm/bias groups (already in build_optimizer — keep)
#   - monitor=f1_tau + TTA (selection hygiene; old LONG used auc)
#   - soft_aug close (aug ON early, OFF late while ES still alive)
# NOT stacked: AMP (D20 null), EMA/LDAM/sampler/progressive (falsified).
base: ../dd_train.yaml

seed: 42

data:
  strong_aug: false
  include_augmented: false
  contrast_stretch: true
  # Measured on lab train split after contrast_stretch + Resize 512 + ToTensor
  # (n=400); see analysis/ultralytics_apply.md
  mean: [0.9817, 0.9817, 0.9817]
  std: [0.0828, 0.0828, 0.0828]

model:
  dropout: 0.3

train:
  # from-scratch (no resume)
  epochs: 120
  freeze_epochs: 0
  backbone_lr_mult: 1.0
  lr: 1.0e-4
  weight_decay: 1.0e-3
  lr_schedule: cosine
  lr_min: 1.0e-6
  warmup_epochs: 3.0
  monitor: f1_tau
  patience: 25
  threshold_criterion: f1
  class_weights: [0.6421, 2.2599]
  class_balanced_sampler: true
  sampler_de_boost: 1.0
  focal_gamma: 0.0
  dice_weight: 0.0
  label_smoothing: 0.0
  tta_hflip: true
  so_penalty: 2.0
  batch_size: 8
  amp: false
  grad_clip_norm: 0.0
  # Mild aug epochs 1–105; last ~15 eval-like (close while patience alive)
  close_train_aug_epochs: 15
  soft_aug_epochs: 0
  out_dir: outputs/htp_depression_dd_exp_d21_long_ddnorm
  log_every: 5
