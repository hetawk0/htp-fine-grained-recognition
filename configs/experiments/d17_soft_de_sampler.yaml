# D17 SOFT_DE_SAMPLER — D1 forever-freeze + mild sampler De oversample (data lever)
# Promoted from deferred D12. Isolates sampler_de_boost=1.20 alone (no strong_aug,
# no f1_de_tau, no dice, LONG CW). D2/D7 stacked De levers; this does not.
# Evidence: D15 EMA null (=D1 0.773); D16 LDAM hurt (0.763); progressive hurt.
# Patience 15 (not 25/45). Single high-EV unfalsified lever.
base: ../dd_train.yaml

seed: 42

data:
  strong_aug: false
  include_augmented: false   # never hospital 1_augmented (leakage)

model:
  dropout: 0.3

train:
  resume: outputs/htp_depression_dd_exp_d1_head_micro/best.pt
  epochs: 50
  freeze_epochs: 999
  backbone_lr_mult: 0.0
  lr: 5.0e-6
  weight_decay: 1.0e-3
  lr_schedule: cosine
  lr_min: 1.0e-8
  monitor: f1_tau
  patience: 15
  threshold_criterion: f1
  class_weights: [0.6421, 2.2599]
  class_balanced_sampler: true
  sampler_de_boost: 1.20       # PRIMARY: clean De oversample via sampler only
  focal_gamma: 0.0
  dice_weight: 0.0
  ldam_max_m: 0.0
  label_smoothing: 0.05
  ema_decay: 0.0
  tta_hflip: true
  tta_mode: hflip
  so_penalty: 2.0
  batch_size: 8
  out_dir: outputs/htp_depression_dd_exp_d17_soft_de_sampler
  log_every: 5
