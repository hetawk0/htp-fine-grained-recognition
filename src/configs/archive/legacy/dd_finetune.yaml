# Topic A — fine-tune SOE-FBANet from LONG best.pt (val_auc≈0.903 @ ep64)
# Not a patience bump: warm-start + lower LR + freeze→unfreeze backbone.
base: ../../dd_train.yaml

train:
  resume: outputs/htp_depression_dd_init/best_long_ep64.pt
  epochs: 40
  freeze_epochs: 8            # train heads/SOFE/attention first
  backbone_lr_mult: 0.1       # after unfreeze: backbone at 0.1× head LR
  lr: 2.0e-5                  # ~5× lower than from-scratch 1e-4
  weight_decay: 1.5e-3        # slightly stronger regularization
  lr_schedule: cosine
  lr_min: 1.0e-7
  monitor: auc
  patience: 12                # safety net only — not the main intervention
  threshold_criterion: f1
  # Keep class_weights / sampler / image_size=512 / include_augmented=false from base
  out_dir: outputs/htp_depression_dd_soe_fbanet_ft
