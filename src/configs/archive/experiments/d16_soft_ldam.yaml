# D16 SOFT_LDAM — D1 forever-freeze + soft LDAM margin (De minority)
# Research: LDAM (Cao NeurIPS'19) enlarges minority margins; single change (no focal stack).
# Evidence: stacked focal hurt; CW retune (D9) null; De F1 is bottleneck (test 0.655).
# Patience 15. Soft max_m=0.3. Keep CE+LS+CBS; monitor f1_tau (not f1_de).
base: ../../dd_train.yaml

seed: 42

data:
  strong_aug: false
  include_augmented: false

model:
  dropout: 0.3

train:
  resume: outputs/htp_depression_dd_exp_d1_head_micro/best.pt
  epochs: 50
  freeze_epochs: 999
  backbone_lr_mult: 0.0
  lr: 5.0e-6
  weight_decay: 1.0e-3
  lr_schedule: cosine
  lr_min: 1.0e-8
  monitor: f1_tau
  patience: 15
  threshold_criterion: f1
  class_weights: [0.6421, 2.2599]
  class_balanced_sampler: true
  sampler_de_boost: 1.0
  focal_gamma: 0.0
  dice_weight: 0.0
  ldam_max_m: 0.3
  ldam_s: 1.0              # soft: margin only (s=30 for normalized features; our logits are raw)
  cls_num_list: [1239, 352]
  label_smoothing: 0.05
  ema_decay: 0.0
  tta_hflip: true
  tta_mode: hflip
  so_penalty: 2.0
  batch_size: 8
  out_dir: outputs/htp_depression_dd_exp_d16_soft_ldam
  log_every: 5
