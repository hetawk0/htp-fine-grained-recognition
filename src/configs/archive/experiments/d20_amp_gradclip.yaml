# D20 AMP_GRADCLIP — Ultralytics optimizer_step defaults (AMP + clip max_norm=10)
# Never tried on Viola. Isolates numeric training stability under D1 freeze.
# Does NOT change aug, loss, sampler, or mean/std (drawing stats deferred to
# from-scratch / LONG remake — freeze-FT cannot retarget ImageNet-normed features).
base: ../../dd_train.yaml

seed: 42

data:
  strong_aug: false
  include_augmented: false

model:
  dropout: 0.3

train:
  resume: outputs/htp_depression_dd_exp_d1_head_micro/best.pt
  epochs: 50
  freeze_epochs: 999
  backbone_lr_mult: 0.0
  lr: 5.0e-6
  weight_decay: 1.0e-3
  lr_schedule: cosine
  lr_min: 1.0e-8
  monitor: f1_tau
  patience: 15
  threshold_criterion: f1
  class_weights: [0.6421, 2.2599]
  class_balanced_sampler: true
  sampler_de_boost: 1.0
  focal_gamma: 0.0
  dice_weight: 0.0
  label_smoothing: 0.05
  tta_hflip: true
  so_penalty: 2.0
  batch_size: 8
  # PRIMARY: Ultralytics AMP + grad clip
  amp: true
  grad_clip_norm: 10.0
  soft_aug_epochs: 0
  out_dir: outputs/htp_depression_dd_exp_d20_amp_gradclip
  log_every: 5
