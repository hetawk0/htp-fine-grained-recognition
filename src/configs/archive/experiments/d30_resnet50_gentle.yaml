# D30 — ResNet50 DD-norm gentler LR + seed13 (last no-new-De train)
# Hypothesis: D27 val-overfits (0.907→0.884). Lower LR + no close_aug + new seed
# may shrink gap. D28 hvflip / D29 seed7 already FAIL worse than D27.
base: ../../dd_train.yaml

seed: 13

data:
  strong_aug: false
  include_augmented: false
  contrast_stretch: true
  mean: [0.9817, 0.9817, 0.9817]
  std: [0.0828, 0.0828, 0.0828]

model:
  backbone: resnet50
  pretrained: true
  dropout: 0.3

train:
  epochs: 120
  freeze_epochs: 0
  backbone_lr_mult: 1.0
  lr: 7.0e-5
  weight_decay: 1.0e-3
  lr_schedule: cosine
  lr_min: 1.0e-6
  warmup_epochs: 3.0
  monitor: f1_tau
  patience: 35
  threshold_criterion: f1
  class_weights: [0.6421, 2.2599]
  class_balanced_sampler: true
  sampler_de_boost: 1.0
  focal_gamma: 0.0
  dice_weight: 0.0
  label_smoothing: 0.0
  tta_hflip: true
  so_penalty: 2.0
  batch_size: 4
  amp: false
  grad_clip_norm: 0.0
  close_train_aug_epochs: 0
  soft_aug_epochs: 0
  out_dir: outputs/htp_depression_dd_exp_d30_resnet50_gentle
  log_every: 5
