# D1 HEAD_MICRO — freeze backbone forever; micro-LR head for F1@τ
# Hypothesis: F1PUSH v2 peaked ep1 then degraded; strong_aug + head LR drifted
# LONG calibration. Keep representation fixed; only nudge classifier/SOFE.
base: ../../dd_train.yaml

seed: 42

data:
  strong_aug: false          # preserve LONG score distribution
  include_augmented: false

model:
  dropout: 0.3

train:
  resume: outputs/htp_depression_dd_init/best_long_ep64.pt
  epochs: 50
  freeze_epochs: 999         # never unfreeze backbone
  backbone_lr_mult: 0.0
  lr: 5.0e-6                 # micro vs v2 1.5e-5
  weight_decay: 1.0e-3
  lr_schedule: cosine
  lr_min: 1.0e-8
  monitor: f1_tau
  patience: 25
  threshold_criterion: f1
  class_weights: [0.6421, 2.2599]
  class_balanced_sampler: true
  sampler_de_boost: 1.0
  focal_gamma: 0.0
  dice_weight: 0.0
  label_smoothing: 0.05
  tta_hflip: true
  so_penalty: 2.0
  batch_size: 8
  out_dir: outputs/htp_depression_dd_exp_d1_head_micro
  log_every: 5
