# D8 LS_EXTEND — D1 refinement: stronger label smoothing + quieter longer head FT
# Hypothesis: D1 peaked ep1 @ τ=0.92 with LS=0.05; val→test F1 gap 0.117 may be
# head overconfidence. Continue from D1 best with forever-freeze, no strong_aug,
# NO de_boost (D7 null), NO focal (D3 null), slightly higher LS + lower LR.
# Distinct from D7 (which pushed De via oversample/dice).
base: ../../dd_train.yaml

seed: 42

data:
  strong_aug: false
  include_augmented: false

model:
  dropout: 0.3

train:
  resume: outputs/htp_depression_dd_exp_d1_head_micro/best.pt
  epochs: 60
  freeze_epochs: 999
  backbone_lr_mult: 0.0
  lr: 2.5e-6                 # quieter than D1 5e-6 / D7 3e-6
  weight_decay: 1.0e-3
  lr_schedule: cosine
  lr_min: 1.0e-8
  monitor: f1_tau
  patience: 30
  threshold_criterion: f1
  class_weights: [0.6421, 2.2599]
  class_balanced_sampler: true
  sampler_de_boost: 1.0      # keep D1; do not repeat D7 de_boost
  focal_gamma: 0.0
  dice_weight: 0.0
  label_smoothing: 0.10      # primary lever vs D1's 0.05
  tta_hflip: true
  so_penalty: 2.0
  batch_size: 8
  out_dir: outputs/htp_depression_dd_exp_d8_ls_extend
  log_every: 5
