# D10 WD_REG — D1 core + ONE lever: stronger weight decay (head regularization)
# Distinct from D9 (CW). Hypothesis: val→test F1 gap 0.117 is mild head overfit
# (D5 showed not scalar T; D8 stronger LS null). Raise WD 1e-3 → 3e-3 only.
base: ../../dd_train.yaml

seed: 42

data:
  strong_aug: false
  include_augmented: false

model:
  dropout: 0.3

train:
  resume: outputs/htp_depression_dd_exp_d1_head_micro/best.pt
  epochs: 50
  freeze_epochs: 999
  backbone_lr_mult: 0.0
  lr: 5.0e-6
  weight_decay: 3.0e-3         # primary lever vs D1 1e-3
  lr_schedule: cosine
  lr_min: 1.0e-8
  monitor: f1_tau
  patience: 25
  threshold_criterion: f1
  class_weights: [0.6421, 2.2599]
  class_balanced_sampler: true
  sampler_de_boost: 1.0
  focal_gamma: 0.0
  dice_weight: 0.0
  label_smoothing: 0.05
  tta_hflip: true
  so_penalty: 2.0
  batch_size: 8
  out_dir: outputs/htp_depression_dd_exp_d10_wd_reg
  log_every: 5
