# D13 PROGRESSIVE_D1 — staged unfreeze from D1 best (anti ep1-stall)
# Hypothesis: forever-freeze + micro-LR (D1/D8–D11) always peaks@ep1 then flat ES.
# Head-only warmup → very low backbone LR lets training keep moving after ep1.
# Success = best epoch ≥ 10 AND progressive val f1_tau gains (not ep1-only champ).
base: ../../dd_train.yaml

seed: 42

data:
  strong_aug: false
  include_augmented: false

model:
  dropout: 0.3

train:
  resume: outputs/htp_depression_dd_exp_d1_head_micro/best.pt
  epochs: 100
  freeze_epochs: 12            # head/SOFE only, then staged unfreeze
  backbone_lr_mult: 0.05       # after unfreeze: bb = 1e-5 * 0.05 = 5e-7
  lr: 1.0e-5                   # head LR; modest vs failed FT 2e-5
  weight_decay: 1.0e-3
  lr_schedule: cosine
  lr_min: 1.0e-8
  monitor: f1_tau
  patience: 45                 # survive past unfreeze; do not ES@20 after ep1
  threshold_criterion: f1
  class_weights: [0.6421, 2.2599]
  class_balanced_sampler: true
  sampler_de_boost: 1.0
  focal_gamma: 0.0
  dice_weight: 0.0
  label_smoothing: 0.05
  tta_hflip: true
  so_penalty: 2.0
  batch_size: 8
  out_dir: outputs/htp_depression_dd_exp_d13_progressive_d1
  log_every: 5
