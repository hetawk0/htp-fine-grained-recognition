# D18 PR_AUC_MONITOR — D1 forever-freeze + monitor=pr_auc (selection lever)
# PR-AUC ranks positives under imbalance; may pick a ckpt that generalizes
# better than f1_tau (val→test gap). F1@τ still logged every epoch + final report.
# Evidence: D15 EMA null; forever-freeze often locks best@ep1 on f1_tau;
#   D2 f1_de_tau hurt — do NOT use f1_de monitor. Patience 15.
base: ../../dd_train.yaml

seed: 42

data:
  strong_aug: false
  include_augmented: false

model:
  dropout: 0.3

train:
  resume: outputs/htp_depression_dd_exp_d1_head_micro/best.pt
  epochs: 50
  freeze_epochs: 999
  backbone_lr_mult: 0.0
  lr: 5.0e-6
  weight_decay: 1.0e-3
  lr_schedule: cosine
  lr_min: 1.0e-8
  monitor: pr_auc              # PRIMARY: ranking selection; F1@τ still reported
  patience: 15
  threshold_criterion: f1
  class_weights: [0.6421, 2.2599]
  class_balanced_sampler: true
  sampler_de_boost: 1.0
  focal_gamma: 0.0
  dice_weight: 0.0
  ldam_max_m: 0.0
  label_smoothing: 0.05
  ema_decay: 0.0
  tta_hflip: true
  tta_mode: hflip
  so_penalty: 2.0
  batch_size: 8
  out_dir: outputs/htp_depression_dd_exp_d18_pr_auc_monitor
  log_every: 5
